name: Laravel 12 upgrade check

on:
  push:
    branches: [upgrade-laravel-12]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: v2board
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: redis, pcntl, posix, fileinfo, pdo_mysql
          tools: none

      - name: Run checks
        shell: bash
        run: |
          export COMPOSER_ALLOW_SUPERUSER=1
          R=report.md
          echo "## PHP ${{ matrix.php }}" > $R
          step() { # name, command...
            local name="$1"; shift
            echo "::group::$name"
            if "$@" > out.txt 2>&1; then s="✅"; else s="❌"; FAILED=1; fi
            cat out.txt
            echo "::endgroup::"
            { echo; echo "### $s $name"; echo '```'; tail -c 6000 out.txt; echo '```'; } >> $R
          }
          FAILED=0

          # 和 init.sh 一样：使用最新版 Composer，安全拦截保持默认开启
          wget -q https://github.com/composer/composer/releases/latest/download/composer.phar -O composer.phar
          step "composer version" php composer.phar --version
          step "composer install" php composer.phar install --no-interaction --no-progress
          step "composer require joanhey/adapterman" php composer.phar require joanhey/adapterman --no-interaction --no-progress
          step "composer audit" php composer.phar audit --no-interaction

          # 逐个加载 app/ 与 library/ 下所有类，捕获签名不兼容等致命错误
          cat > /tmp/loadall.sh <<'EOF'
          fail=0
          for f in $(find app library -name '*.php'); do
            cls=$(php -r '$c=file_get_contents($argv[1]); preg_match("/^namespace\s+([^;]+);/m",$c,$n); preg_match("/^(?:final\s+|abstract\s+)?(?:class|interface|trait|enum)\s+(\w+)/m",$c,$k); if($k) echo (isset($n[1])?$n[1]."\\":"").$k[1];' "$f")
            [ -z "$cls" ] && continue
            out=$(php -r 'require "vendor/autoload.php"; $a=require "bootstrap/app.php"; $a->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); $c=$argv[1]; if(!class_exists($c)&&!interface_exists($c)&&!trait_exists($c)&&!enum_exists($c)){fwrite(STDERR,"not found");exit(1);}' "$cls" 2>&1) || { echo "FAIL $cls: $out" | head -c 800; echo; fail=1; }
          done
          echo "checked"; exit $fail
          EOF

          cp .env.example .env
          sed -i 's/^APP_KEY=.*/APP_KEY=base64:'"$(head -c 32 /dev/urandom | base64)"'/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/; s/^DB_DATABASE=.*/DB_DATABASE=v2board/; s/^DB_PASSWORD=.*/DB_PASSWORD=root/; s/^APP_DEBUG=.*/APP_DEBUG=true/' .env

          step "artisan boots" php artisan --version
          step "load every class" bash /tmp/loadall.sh
          step "route:list" bash -c "php artisan route:list | tail -5"

          # 真正跑一遍安装命令（导入 install.sql + 创建管理员）
          mv .env .env.ci
          step "v2board:install" bash -c "printf '127.0.0.1\nv2board\nroot\nroot\nadmin@example.com\n' | php artisan v2board:install"
          [ -f .env ] || mv .env.ci .env
          sed -i 's/^APP_DEBUG=.*/APP_DEBUG=true/' .env
          step "tables imported" bash -c "mysql -h127.0.0.1 -uroot -proot -N -e \"select count(*) from information_schema.tables where table_schema='v2board'; select email,is_admin from v2board.v2_user;\""
          step "v2board:update" php artisan v2board:update
          step "mysql log channel" bash -c "php artisan tinker --execute=\"Log::error('ci log test'); echo App\\Models\\Log::where('title','ci log test')->count();\""
          step "schedule:list" php artisan schedule:list
          step "horizon:list commands" bash -c "php artisan list | grep -c horizon"

          # HTTP 冒烟测试
          php artisan serve --host=127.0.0.1 --port=8000 > serve.log 2>&1 &
          sleep 4
          step "GET /api/v1/guest/comm/config" bash -c "curl -sS -w '\nHTTP %{http_code}\n' http://127.0.0.1:8000/api/v1/guest/comm/config | tail -c 1500; curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/guest/comm/config | grep -q 200"
          step "GET /api/v1/guest/plan/fetch" bash -c "curl -sS -w '\nHTTP %{http_code}\n' http://127.0.0.1:8000/api/v1/guest/plan/fetch | tail -c 800"
          step "POST /api/v1/passport/auth/login (wrong pw)" bash -c "curl -sS -w '\nHTTP %{http_code}\n' -X POST -d 'email=admin@example.com&password=wrongpass' http://127.0.0.1:8000/api/v1/passport/auth/login | tail -c 800"
          step "GET / (theme)" bash -c "curl -sS -o /dev/null -w 'HTTP %{http_code}\n' http://127.0.0.1:8000/ ; curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/ | grep -q 200"
          step "laravel.log" bash -c "tail -c 4000 storage/logs/*.log 2>/dev/null; tail -c 2000 serve.log; true"

          echo "FAILED=$FAILED" >> $GITHUB_ENV

      - name: Post report as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head -c 60000 report.md > body.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@body.md > /dev/null

      - name: Fail if any check failed
        if: env.FAILED == '1'
        run: exit 1
